name: Update haze station reading

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch DOE APIMS station reading (via WAQI)
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: python3 scripts/fetch_haze.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/haze.json
          git diff --quiet --cached || git commit -m "Update haze station reading"
          git push
